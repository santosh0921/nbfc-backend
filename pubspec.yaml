name: nbfc_premium
description: "NBFC Premium — a modern Indian NBFC banking app (frontend-only, mock data)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.7
  provider: ^6.1.2
  google_fonts: ^8.2.0
  intl: ^0.20.2
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  image_cropper_platform_interface: 7.1.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4

  # --- Employee role (ported from onefin_employee) ---
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  equatable: ^2.0.5
  logger: ^2.4.0
  cached_network_image: ^3.4.1
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  camera: ^0.11.0+2
  file_picker: ^11.0.2
  share_plus: ^10.1.4
  signature: ^5.5.0
  crypto: ^3.0.3
  flutter_webrtc: ^0.12.10
  web_socket_channel: ^3.0.1
  vibration: ^3.1.8
  flutter_ringtone_player: ^4.0.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/images/
