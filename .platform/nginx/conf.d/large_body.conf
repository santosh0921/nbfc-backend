# Elastic Beanstalk's default nginx reverse proxy caps request bodies at
# ~1MB, well under the Go app's own 15MB limit (internal/middleware/max_body_size.go,
# cmd/api/main.go) — so a KYC document upload (base64-encoded image/PDF,
# a few MB) was rejected by nginx itself before ever reaching the app,
# with nginx's own HTML error page in place of the JSON response the
# client expects. Match nginx's limit to the app's so the app-level limit
# (and its proper JSON error response) is the one that actually applies.
client_max_body_size 16M;
